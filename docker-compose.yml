version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: 69club_server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - club_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_DOMAIN: ${APP_DOMAIN:-69club1.site}
        VITE_API_DOMAIN: ${API_DOMAIN:-api.69club1.site}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://cunkbkikdbhatiumxrjj.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-sb_publishable_YcmBWWFDZkylAcVlhtChug_UNDCjqKf}
    container_name: 69club_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - club_network

networks:
  club_network:
    driver: bridge
